[workspace]
resolver = "3"
members = ["crates/core", "crates/ram", "crates/egpu", "crates/net", "crates/service", "apps/keel", "apps/tray", "apps/gui"]

[workspace.package]
version = "0.1.38"
edition = "2024"

[workspace.dependencies]
keel-core = { path = "crates/core" }
keel-ram = { path = "crates/ram" }
keel-egpu = { path = "crates/egpu" }
keel-net = { path = "crates/net" }
keel-service = { path = "crates/service" }
adlx-lite = "1.0.0"
nvml-wrapper = "0.13.0"
sevenz-rust2 = "0.24.2"
sysinfo = "0.40.1"
toml = "1.1.8"
ureq = { version = "3.5.1", features = ["json"] }
windows-service = "0.8.1"
anyhow = "1.0.104"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = "0.62.2"
winreg = "0.56.0"
embed-resource = "3.0.12"

[profile.release]
lto = "thin"
strip = true
