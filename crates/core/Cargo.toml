[package]
name = "keel-core"
version.workspace = true
edition.workspace = true
description = "Keel shared code: paths, log, process launching, single instance, working-set trim, control pipe, feature supervisor"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
embed-resource = { workspace = true, optional = true }

[features]
# For build scripts only: `keel_core::build::embed_icon()`.
build = ["dep:embed-resource"]
