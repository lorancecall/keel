[package]
name = "keel-gui"
version.workspace = true
edition.workspace = true
description = "Keel main window (Slint)"

[[bin]]
name = "keel-gui"
path = "src/main.rs"

[dependencies]
keel-core.workspace = true
keel-ram.workspace = true
keel-egpu.workspace = true
keel-net.workspace = true
keel-service.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
rfd = "0.17.2"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Threading"] }

[build-dependencies]
keel-core = { workspace = true, features = ["build"] }
slint-build = "1.18.1"
