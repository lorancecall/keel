[package]
name = "keel"
version.workspace = true
edition.workspace = true
description = "Keel: memory, eGPU and network guard for one Legion Go"

[dependencies]
keel-core.workspace = true
keel-ram.workspace = true
keel-egpu.workspace = true
keel-net.workspace = true
keel-service.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
winreg.workspace = true
toml.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_HiDpi"] }

[build-dependencies]
keel-core = { workspace = true, features = ["build"] }
